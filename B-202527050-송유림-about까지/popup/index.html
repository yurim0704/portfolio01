<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <h1>Portfolio</h1>
    <div class="grid">
        <!-- 카드01 -->
         <div class="card" onclick="openModal('img/01.jpg', '파이썬 머신러닝 개발 프로젝트 수상', '2025.06 인하공업전문대학 주최 파이썬 머신러닝 개발 프로젝트 3등 수상')">
            <!-- onclick="openModal": 클릭하면 openModal(..)함수 실행
            이미지 나오고(img/01.jpg): modal안에 보여질 이미지
            모달제목, 설명텍스트 같이 등장 -->
            <img class="card-thumb" src="img/01.jpg" alt="01">
            <div class="card-info">
                <h3>파이썬 머신러닝 개발 프로젝트 수상</h3>
                <span>2025.06 인하공업전문대학 주최 파이썬 머신러닝 개발 프로젝트 3등 수상</span>
            </div>
         </div>

         <!-- 카드02 -->
         <div class="card" onclick="openModal('img/02.jpg', '파이썬 머신러닝 개발 프로젝트 수상', '2025.06 인하공업전문대학 주최 파이썬 머신러닝 개발 프로젝트 3등 수상')">
            <img class="card-thumb" src="img/02.jpg" alt="02">
            <div class="card-info">
                <h3>파이썬 머신러닝 개발 프로젝트 수상</h3>
                <span>2025.06 인하공업전문대학 주최 파이썬 머신러닝 개발 프로젝트 3등 수상</span>
            </div>
         </div>

         <!-- 카드03 -->
         <div class="card" onclick="openModal('img/03.jpg', '파이썬 머신러닝 개발 프로젝트 수상', '2025.06 인하공업전문대학 주최 파이썬 머신러닝 개발 프로젝트 3등 수상')">
            <img class="card-thumb" src="img/03.jpg" alt="03">
            <div class="card-info">
                <h3>파이썬 머신러닝 개발 프로젝트 수상</h3>
                <span>2025.06 인하공업전문대학 주최 파이썬 머신러닝 개발 프로젝트 3등 수상</span>
            </div>
         </div>

    </div>
    
    <script>

     function openModal(imgSrc, title, desc){
          document.getElementById('modal-img').src = imgSrc;
          document.getElementById('modal-img').alt = title;
          document.getElementById('modal-title').textContent = title;
          document.getElementById('modal-desc').textContent = desc;
          document.getElementById('modal-bg').classList.add('open');
     }

    function closeModal(e) {
        if (!e || e.target === document.getElementById('modal-bg')) {
            document.getElementById('modal-bg').classList.remove('open');
        }
    }
  </script>
</body>
</html>
